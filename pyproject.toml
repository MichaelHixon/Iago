[project]
name = "iago"
version = "0.1.0"
description = "Iago — authorized LLM guardrail red-team harness (defensive research)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Hixon" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "ollama>=0.3",
    "pyyaml>=6",
]

[project.scripts]
iago = "iago.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iago"]
