[project]
name = "iago"
version = "0.1.0"
description = "Iago — an authorized tool for testing LLM guardrails (defensive research)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Michael Hixon" }]
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.120.0",
    "ollama>=0.3",
    "pyyaml>=6",
]

[project.scripts]
iago = "iago.cli:main"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=8",
    "ruff>=0.14",
]

[tool.ruff.lint]
# Real defects only (unused/undefined names, syntax errors); style is not gated.
select = ["F", "E9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iago"]

[tool.mypy]
python_version = "3.14"
files = ["iago"]

[[tool.mypy.overrides]]
# PyYAML ships no inline types; the only untyped third-party import.
module = ["yaml"]
ignore_missing_imports = true
