name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest moves to 26 on 2026-10-19
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # uv 0.12.18 (2026-09-22). Dependabot cannot bump this input; bump it by hand
          # whenever a Dependabot PR bumps setup-uv.
          version: "0.12.18"
          # sha256 of uv-x86_64-unknown-linux-gnu.tar.gz 0.12.18 (runner is ubuntu-24.04 x86_64);
          # fetched from GitHub Releases, so download from there rather than the mirror.
          checksum: "89eadd7c76fc063887959510d5ba0ab1264dfd5f1143b925ddb73021a40acf16"
          download-from-astral-mirror: "false"
          python-version: "3.14"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint (pyflakes-level)
        run: uv run ruff check iago tests
      - name: Type-check
        run: uv run mypy iago
      - name: Test (offline; no Ollama, no API key)
        run: uv run pytest -q
